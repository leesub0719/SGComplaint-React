name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/sgcomplaint-web/package-lock.json

      - name: Build React application
        working-directory: frontend/sgcomplaint-web
        run: |
          npm ci
          npm run build

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build executable JAR
        run: ./gradlew clean test bootJar --no-daemon

      - name: Collect executable JAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar')
          [[ ${#jars[@]} -eq 1 ]] || { echo "Expected one executable JAR, found ${#jars[@]}" >&2; exit 1; }
          mkdir -p artifact
          cp "${jars[0]}" artifact/sgcomplaint.jar

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: sgcomplaint-jar-${{ github.sha }}
          path: artifact/sgcomplaint.jar
          if-no-files-found: error
          retention-days: 7

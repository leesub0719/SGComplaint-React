name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sgcomplaint-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/sgcomplaint-web/package-lock.json

      - name: Build React application
        working-directory: frontend/sgcomplaint-web
        run: |
          npm ci
          npm run build

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build executable JAR
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean test bootJar --no-daemon
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar')
          [[ ${#jars[@]} -eq 1 ]] || { echo "Expected one executable JAR, found ${#jars[@]}" >&2; exit 1; }
          mkdir -p artifact
          cp "${jars[0]}" artifact/sgcomplaint.jar
          sha256sum artifact/sgcomplaint.jar

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: sgcomplaint-production-${{ github.sha }}
          path: artifact/sgcomplaint.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, sgcomplaint-prod]
    environment: production
    timeout-minutes: 15

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: sgcomplaint-production-${{ github.sha }}
          path: artifact

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s artifact/sgcomplaint.jar
          install -m 0640 artifact/sgcomplaint.jar /opt/sgcomplaint/incoming/sgcomplaint.jar

      - name: Deploy, migrate and verify
        run: sudo /usr/local/sbin/sgcomplaint-deploy
